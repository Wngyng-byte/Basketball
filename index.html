<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Legends Arcade Sandbox</title>
    <style>
        body {
            margin: 0;
            background: #0b0b12;
            font-family: 'Arial Black', Gadget, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(to bottom, #1f3c75, #4364a1, #f2a154); /* Classic bright flash stadium backdrop */
            border: 5px solid #222;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
        }
        .scoreboard {
            display: flex;
            gap: 40px;
            font-size: 32px;
            margin-bottom: 15px;
            background: #111;
            padding: 8px 35px;
            border-radius: 6px;
            border: 3px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .p1-score { color: #2e86de; }
        .p2-score { color: #ff3838; }
        .controls-guide {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 15px;
            font-size: 12px;
            font-family: sans-serif;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        <span class="p1-score">BLUE: <span id="p1-score-val">0</span></span>
        <span style="color:#f1c40f;" id="timer-val">VS</span>
        <span class="p2-score">RED: <span id="p2-score-val">0</span></span>
    </div>

    <canvas id="courtCanvas" width="800" height="400"></canvas>

    <div class="controls-guide">
        <div>
            <strong style="color:#2e86de;">PLAYER 1 (BLUE)</strong><br>
            Move: A/D | Jump: W<br>
            Shoot / Steal / Dunk: V | Super Shot: B
        </div>
        <div>
            <strong style="color:#ff3838;">PLAYER 2 (RED)</strong><br>
            Move: Left/Right Arrows | Jump: Up Arrow<br>
            Shoot / Steal / Dunk: K | Super Shot: L
        </div>
    </div>

<script>
const canvas = document.getElementById("courtCanvas");
const ctx = canvas.getContext("2d");

const GRAVITY = 0.42;
const FRICTION = 0.85;
let p1Score = 0;
let p2Score = 0;

// --- PLAYER ARCADE PARAMETERS ---
const p1 = {
    x: 180, y: 250, vx: 0, vy: 0,
    width: 44, height: 50, headSize: 42,
    color: "#2e86de", numColor: "#fff", faceColor: "#ffcc99",
    superMeter: 0, isJumping: false, hasBall: false, id: 1, facing: 1,
    isDunking: false, dunkTimer: 0
};

const p2 = {
    x: 620, y: 250, vx: 0, vy: 0,
    width: 44, height: 50, headSize: 42,
    color: "#ff3838", numColor: "#fff", faceColor: "#e0ae85",
    superMeter: 0, isJumping: false, hasBall: false, id: 2, facing: -1,
    isDunking: false, dunkTimer: 0
};

const ball = {
    x: 400, y: 120, vx: 0, vy: 0,
    radius: 11, color: "#e67e22", linesColor: "#222",
    bounciness: 0.72, owner: null,
    isSuperShot: false
};

const floorY = 360;

// --- SCREEN-LOCKED HOOP STRUCTURES ---
const boardLeft = { x: 0, y: 80, width: 8, height: 75 };
const hoopLeft = { x: 8, y: 130, width: 42, height: 6, ringX: 29 };

const boardRight = { x: 792, y: 80, width: 8, height: 75 };
const hoopRight = { x: 750, y: 130, width: 42, height: 6, ringX: 771 };

const keys = {};
window.addEventListener("keydown", (e) => { keys[e.code] = true; handleActionKeys(e.code); });
window.addEventListener("keyup", (e) => keys[e.code] = false);

function handleActionKeys(code) {
    if (code === "KeyV") {
        if (p1.hasBall) {
            if (p1.x > 620 && p1.isJumping) triggerDunk(p1, hoopRight);
            else shootBall(p1, 1);
        } else {
            attemptSteal(p1, p2);
        }
    }
    if (code === "KeyB" && p1.hasBall && p1.superMeter >= 100) {
        shootBall(p1, 1, true);
    }

    if (code === "KeyK") {
        if (p2.hasBall) {
            if (p2.x < 140 && p2.isJumping) triggerDunk(p2, hoopLeft);
            else shootBall(p2, -1);
        } else {
            attemptSteal(p2, p1);
        }
    }
    if (code === "KeyL" && p2.hasBall && p2.superMeter >= 100) {
        shootBall(p2, -1, true);
    }
}

function triggerDunk(player, targetHoop) {
    player.isDunking = true;
    player.dunkTimer = 25; 
    ball.isSuperShot = false;
}

function shootBall(player, direction, isSuper = false) {
    player.hasBall = false;
    ball.owner = null;
    ball.x = player.x + (direction * 35);
    ball.y = player.y - 45;
    
    if (isSuper) {
        let targetHoopX = direction === 1 ? hoopRight.ringX : hoopLeft.ringX;
        let accuracyRoll = Math.random();
        let targetXModifier = 0;
        let targetYModifier = 0;
        
        if (accuracyRoll > 0.90) { 
            targetXModifier = (Math.random() - 0.5) * 45;
            targetYModifier = -25;
        }

        let dx = (targetHoopX + targetXModifier) - ball.x;
        let dy = (130 + targetYModifier) - ball.y;
        
        ball.vx = dx * 0.062;
        ball.vy = dy * 0.062 - 6.5; 
        ball.isSuperShot = true;
        player.superMeter = 0;
    } else {
        ball.vx = direction * 6.8 + player.vx * 0.45;
        ball.vy = -11.5;
        ball.isSuperShot = false;
    }
}

function attemptSteal(robber, victim) {
    let dist = Math.hypot(robber.x - victim.x, robber.y - victim.y);
    if (dist < 75 && victim.hasBall) {
        victim.hasBall = false;
        ball.owner = robber;
        robber.hasBall = true;
        robber.superMeter = Math.min(100, robber.superMeter + 30);
    }
}

function update() {
    // --- PLAYER 1 LOCOMOTION ENGINE ---
    if (p1.isDunking) {
        processDunkMovement(p1, hoopRight, 1);
    } else {
        if (keys["KeyA"]) { p1.vx -= 0.55; p1.facing = -1; }
        if (keys["KeyD"]) { p1.vx += 0.55; p1.facing = 1; }
        if (keys["KeyW"] && !p1.isJumping) { p1.vy = -10.5; p1.isJumping = true; }
        p1.vy += GRAVITY; p1.vx *= FRICTION; p1.x += p1.vx; p1.y += p1.vy;
    }

    // --- PLAYER 2 LOCOMOTION ENGINE ---
    if (p2.isDunking) {
        processDunkMovement(p2, hoopLeft, -1);
    } else {
        if (keys["ArrowLeft"]) { p2.vx -= 0.55; p2.facing = -1; }
        if (keys["ArrowRight"]) { p2.vx += 0.55; p2.facing = 1; }
        if (keys["ArrowUp"] && !p2.isJumping) { p2.vy = -10.5; p2.isJumping = true; }
        p2.vy += GRAVITY; p2.vx *= FRICTION; p2.x += p2.vx; p2.y += p2.vy;
    }

    // Floor Boundary Box Collision
    if (p1.y >= floorY - p1.height) { p1.y = floorY - p1.height; p1.vy = 0; p1.isJumping = false; }
    if (p2.y >= floorY - p2.height) { p2.y = floorY - p2.height; p2.vy = 0; p2.isJumping = false; }

    // Screen Bounds Collision
    p1.x = Math.max(8, Math.min(canvas.width - p1.width - 8, p1.x));
    p2.x = Math.max(8, Math.min(canvas.width - p2.width - 8, p2.x));

    // --- BALL HANDLING SEQUENCE ---
    if (ball.owner) {
        if (ball.owner.isDunking) {
            ball.x = ball.owner.x + (ball.owner.width / 2) + (ball.owner.facing * 20);
            ball.y = ball.owner.y - 10;
        } else {
            ball.x = ball.owner.x + (ball.owner.width / 2) + (ball.owner.facing * 16);
            ball.y = ball.owner.y - 25;
        }
        ball.vx = 0; ball.vy = 0;
    } else {
        ball.vy += GRAVITY;
        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.y >= floorY - ball.radius) {
            ball.y = floorY - ball.radius;
            ball.vy = -ball.vy * ball.bounciness;
            ball.vx *= 0.92;
            ball.isSuperShot = false;
        }

        if (ball.x <= ball.radius || ball.x >= canvas.width - ball.radius) {
            ball.vx = -ball.vx * ball.bounciness;
            ball.x = ball.x <= ball.radius ? ball.radius : canvas.width - ball.radius;
        }

        checkBackboardCollision(boardLeft);
        checkBackboardCollision(boardRight);

        checkBallPickup(p1);
        checkBallPickup(p2);

        checkGoal(hoopRight, 1); 
        checkGoal(hoopLeft, 2);  
    }

    draw();
    requestAnimationFrame(update);
}

function processDunkMovement(player, hoop, sideDirection) {
    player.dunkTimer--;
    
    if (player.dunkTimer > 10) {
        let targetX = sideDirection === 1 ? hoop.x - 30 : hoop.x + hoop.width - 10;
        let targetY = hoop.y - 70;
        player.x += (targetX - player.x) * 0.25;
        player.y += (targetY - player.y) * 0.25;
    } else if (player.dunkTimer <= 10 && player.dunkTimer > 0) {
        player.y += 14;
        
        if (player.hasBall && player.dunkTimer === 5) {
            player.hasBall = false;
            ball.owner = null;
            
            if (player.id === 1) {
                p1Score++;
                document.getElementById("p1-score-val").innerText = p1Score;
                p1.superMeter = Math.min(100, p1.superMeter + 35);
            } else {
                p2Score++;
                document.getElementById("p2-score-val").innerText = p2Score;
                p2.superMeter = Math.min(100, p2.superMeter + 35);
            }
            
            ball.x = hoop.ringX;
            ball.y = hoop.y + 15;
            ball.vx = 0;
            ball.vy = 3;
        }
    } else {
        player.isDunking = false;
        resetBallPosition(); 
    }
}

function checkBackboardCollision(board) {
    let closestX = Math.max(board.x, Math.min(ball.x, board.x + board.width));
    let closestY = Math.max(board.y, Math.min(ball.y, board.y + board.height));
    let distance = Math.hypot(ball.x - closestX, ball.y - closestY);
    
    if (distance < ball.radius) {
        ball.vx = -ball.vx * 0.75;
        if (ball.x < board.x) ball.x = board.x - ball.radius;
        else ball.x = board.x + board.width + ball.radius;
        ball.isSuperShot = false;
    }
}

function checkBallPickup(player) {
    if (ball.owner !== null || player.isDunking) return;
    let centerX = player.x + (player.width / 2);
    let centerY = player.y + (player.height / 2);
    let dist = Math.hypot(ball.x - centerX, ball.y - centerY);
    
    if (dist < player.width + 10) {
        ball.owner = player;
        player.hasBall = true;
    }
}

function checkGoal(hoop, scoringPlayerId) {
    if (ball.x > hoop.x && ball.x < hoop.x + hoop.width && ball.y > hoop.y && ball.y < hoop.y + hoop.height && ball.vy > 0) {
        if (scoringPlayerId === 1) { 
            p1Score++; 
            document.getElementById("p1-score-val").innerText = p1Score; 
            p1.superMeter = Math.min(100, p1.superMeter + 35); 
        } else { 
            p2Score++; 
            document.getElementById("p2-score-val").innerText = p2Score; 
            p2.superMeter = Math.min(100, p2.superMeter + 35); 
        }
        resetBallPosition();
    }
}

// --- UPDATED RESET ENGINE SYSTEM ---
function resetBallPosition() {
    // 1. Reset Ball Vectors
    ball.owner = null; 
    ball.x = 400; 
    ball.y = 90; 
    ball.vx = 0; 
    ball.vy = 2; 
    ball.isSuperShot = false;

    // 2. Reset Player 1 Position and Kinetics
    p1.hasBall = false;
    p1.isDunking = false;
    p1.dunkTimer = 0;
    p1.x = 180;
    p1.y = floorY - p1.height;
    p1.vx = 0;
    p1.vy = 0;
    p1.facing = 1;

    // 3. Reset Player 2 Position and Kinetics
    p2.hasBall = false;
    p2.isDunking = false;
    p2.dunkTimer = 0;
    p2.x = 620;
    p2.y = floorY - p2.height;
    p2.vx = 0;
    p2.vy = 0;
    p2.facing = -1;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 5;
    ctx.strokeRect(0, 50, 800, 310);

    drawHoopStructure(boardLeft, hoopLeft, false);
    drawHoopStructure(boardRight, hoopRight, true);

    ctx.fillStyle = "#e58e26"; ctx.fillRect(0, floorY, canvas.width, 40);
    ctx.fillStyle = "#111"; ctx.fillRect(0, floorY, canvas.width, 4); 

    drawFlashPlayer(p1);
    drawFlashPlayer(p2);

    ctx.save();
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = ball.isSuperShot ? "#ff0000" : ball.color;
    if (ball.isSuperShot) { ctx.shadowBlur = 35; ctx.shadowColor = "#ffea00"; }
    ctx.fill();
    ctx.strokeStyle = ball.linesColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
}

function drawHoopStructure(board, hoop, isRightSide) {
    ctx.strokeStyle = "#111"; ctx.lineWidth = 3;
    ctx.fillStyle = "#fff"; ctx.fillRect(board.x, board.y, board.width, board.height);
    ctx.strokeRect(board.x, board.y, board.width, board.height);

    ctx.strokeStyle = "#eee"; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = hoop.x; i <= hoop.x + hoop.width; i += 7) {
        ctx.moveTo(i, hoop.y);
        ctx.lineTo(i + (isRightSide ? -5 : 5), hoop.y + 25);
    }
    ctx.stroke();

    ctx.fillStyle = "#ff3838"; ctx.fillRect(hoop.x, hoop.y, hoop.width, hoop.height);
}

function drawFlashPlayer(p) {
    ctx.save();
    ctx.strokeStyle = "#111"; 
    ctx.lineWidth = 3;

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.width, p.height, 6); 
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.fillRect(p.x, p.y, p.width, 8);
    ctx.strokeRect(p.x, p.y, p.width, 8);

    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.font = "bold 16px Arial";
    ctx.fillText("23", p.x + 12, p.y + 32);

    let headX = p.x + (p.width / 2) - (p.headSize / 2);
    let headY = p.y - p.headSize + 4;
    
    ctx.fillStyle = p.faceColor;
    ctx.beginPath();
    ctx.roundRect(headX, headY, p.headSize, p.headSize, 12);
    ctx.fill();
    ctx.stroke();

    let eyeDirectionOffset = p.facing * 7;
    let eyeX = p.x + (p.width / 2) + eyeDirectionOffset;
    let eyeY = headY + 14;

    ctx.fillStyle = "#fff";
    ctx.fillRect(eyeX - 5, eyeY - 4, 11, 10);
    ctx.strokeRect(eyeX - 5, eyeY - 4, 11, 10);

    ctx.fillStyle = "#000";
    ctx.fillRect(eyeX - 2 + (p.facing * 2), eyeY - 2, 5, 6);

    ctx.fillStyle = "#222"; ctx.fillRect(p.x, p.y + p.height + 10, p.width, 6);
    ctx.fillStyle = p.superMeter >= 100 ? "#00ffcc" : "#f1c40f"; 
    ctx.fillRect(p.x, p.y + p.height + 10, (p.superMeter / 100) * p.width, 6);

    ctx.restore();
}

update();
</script>
</body>
</html>
